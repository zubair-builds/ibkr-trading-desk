version: '3.8'

services:
  trading-bot:
    build: .
    environment:
      # TWS config for the bundled gateway
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - VNC_PASSWORD=${VNC_PASSWORD:-password}
      - ALLOW_BLIND_TRADING=yes
      - READ_ONLY_API=no
      - AUTO_RESTART_TIME=03:00
      - RELOGIN_AFTER_TWOFA_TIMEOUT=no
      - TWS_MAX_HEAP=256m
      
      # Bot configuration
      - CLIENT_ID=1
      - ENV=paper
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-admin}
    ports:
      - "4001:4003" # API for live trading
      - "4002:4004" # API for paper trading
      - "5900:5900" # VNC port (for debugging the gateway visually)
      - "8000:8000" # FastAPI backend
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./strategy:/app/strategy
    restart: on-failure

  scheduler:
    image: ibkr_bot-trading-bot:latest
    network_mode: "service:trading-bot"
    depends_on:
      - trading-bot
    volumes:
      - ./strategy:/app/strategy
    entrypoint: []
    command: ["python", "-u", "/app/strategy/trend_join/scheduler.py"]
    restart: unless-stopped
